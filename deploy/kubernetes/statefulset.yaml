apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kvstore
  labels:
    app: kvstore
spec:
  serviceName: kvstore-headless
  replicas: 1
  selector:
    matchLabels:
      app: kvstore
  template:
    metadata:
      labels:
        app: kvstore
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kvstore
          image: kvstore:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 7002
          env:
            - name: KVSTORE_MODE
              value: standalone
            - name: KVSTORE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Refuse to run extra standalone Pods if someone scales the StatefulSet.
            - name: KVSTORE_EXPECTED_NODE_ID
              value: kvstore-0
            - name: KVSTORE_LISTEN_ADDR
              value: ":50051"
            - name: KVSTORE_DATA_DIR
              value: /data
            - name: KVSTORE_SHUTDOWN_TIMEOUT
              value: 15s
            - name: KVSTORE_HEALTH_LISTEN_ADDR
              value: 127.0.0.1:50052
            - name: KVSTORE_HEALTH_ADDR
              value: 127.0.0.1:50052
            - name: KVSTORE_MAX_INFLIGHT_RPCS
              value: '1024'
            - name: KVSTORE_MAX_STREAMS
              value: '256'
            - name: KVSTORE_STANDALONE_ADMIN_ADDR
              value: ':7002'
            - name: KVSTORE_METRICS_TOKEN
              valueFrom:
                secretKeyRef: {name: kvstore-metrics, key: token, optional: true}
            - name: KVSTORE_TLS_CERT_FILE
              value: /etc/kvstore/tls/server.crt
            - name: KVSTORE_TLS_KEY_FILE
              value: /etc/kvstore/tls/server.key
            - name: KVSTORE_TLS_CLIENT_CA_FILE
              value: /etc/kvstore/tls/client-ca.crt
            - name: KVSTORE_ACCESS_POLICY_FILE
              valueFrom:
                secretKeyRef:
                  name: kvstore-access-policy
                  key: path
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /etc/kvstore/tls
              readOnly: true
            - name: access-policy
              mountPath: /etc/kvstore/access
              readOnly: true
          startupProbe:
            exec:
              command: [/usr/local/bin/kvstore, healthcheck, liveness]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [/usr/local/bin/kvstore, healthcheck, readiness]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [/usr/local/bin/kvstore, healthcheck, liveness]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls
          secret:
            secretName: kvstore-server-tls
            defaultMode: 0440
        - name: access-policy
          secret:
            secretName: kvstore-access-policy
            optional: true
            defaultMode: 0440
            items:
              - key: policy.json
                path: policy.json
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
