apiVersion: v1
kind: Service
metadata:
  name: kvstore
  labels:
    app: kvstore
spec:
  type: ClusterIP
  selector:
    app: kvstore
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
# Stable pod DNS for a future Raft cluster. This does not enable clustering.
apiVersion: v1
kind: Service
metadata:
  name: kvstore-headless
  labels:
    app: kvstore
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kvstore
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
