apiVersion: v1
kind: Service
metadata:
  name: kvstore
  labels:
    app: kvstore
spec:
  type: ClusterIP
  selector:
    app: kvstore
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: kvstore-headless
  labels:
    app: kvstore
spec:
  clusterIP: None
  selector:
    app: kvstore
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
