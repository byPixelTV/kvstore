apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../raft
namePrefix: shard-0-
labels:
  - pairs:
      app: shard-0-kvstore-raft
    includeSelectors: true
replacements:
  - source:
      kind: StatefulSet
      fieldPath: metadata.name
    targets:
      - select:
          kind: StatefulSet
        fieldPaths:
          - spec.template.spec.containers.[name=kvstore].env.[name=STATEFULSET_NAME].value
