apiVersion: v1
kind: Service
metadata:
  name: kvstore-router
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: kvstore-router
  ports:
    - {name: grpc, port: 5443, targetPort: grpc}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kvstore-router
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/component: kvstore-router}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvstore-router
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app.kubernetes.io/component: kvstore-router}
  template:
    metadata:
      labels: {app.kubernetes.io/component: kvstore-router}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
                  - {key: node-role.kubernetes.io/master, operator: DoesNotExist}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/component: kvstore-router}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kvstore
          image: kvstore:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: admin, containerPort: 7002}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: CLUSTER_DOMAIN, value: cluster.local}
            - {name: SHARD_0_DNS, value: 'shard-0-kvstore-raft-headless.$(POD_NAMESPACE).svc.$(CLUSTER_DOMAIN)'}
            - {name: SHARD_1_DNS, value: 'shard-1-kvstore-raft-headless.$(POD_NAMESPACE).svc.$(CLUSTER_DOMAIN)'}
            - {name: SHARD_2_DNS, value: 'shard-2-kvstore-raft-headless.$(POD_NAMESPACE).svc.$(CLUSTER_DOMAIN)'}
            - {name: KVSTORE_MODE, value: router}
            - {name: KVSTORE_LISTEN_ADDR, value: ':50051'}
            - {name: KVSTORE_SHARD_LAYOUT_VERSION, value: '1'}
            - name: KVSTORE_SHARDS
              value: >-
                shard-0-kvstore-raft-0.$(SHARD_0_DNS):50051,shard-0-kvstore-raft-1.$(SHARD_0_DNS):50051,shard-0-kvstore-raft-2.$(SHARD_0_DNS):50051;
                shard-1-kvstore-raft-0.$(SHARD_1_DNS):50051,shard-1-kvstore-raft-1.$(SHARD_1_DNS):50051,shard-1-kvstore-raft-2.$(SHARD_1_DNS):50051;
                shard-2-kvstore-raft-0.$(SHARD_2_DNS):50051,shard-2-kvstore-raft-1.$(SHARD_2_DNS):50051,shard-2-kvstore-raft-2.$(SHARD_2_DNS):50051
            - name: KVSTORE_JOIN_TOKEN
              valueFrom:
                secretKeyRef: {name: kvstore-raft-auth, key: join-token}
            - {name: KVSTORE_ROUTER_ADMIN_ADDR, value: ':7002'}
            - name: KVSTORE_ROUTER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: kvstore-router-auth, key: admin-token}
            - name: KVSTORE_METRICS_TOKEN
              valueFrom:
                secretKeyRef: {name: kvstore-metrics, key: token, optional: true}
            - {name: KVSTORE_HEALTH_LISTEN_ADDR, value: '127.0.0.1:50052'}
            - {name: KVSTORE_HEALTH_ADDR, value: '127.0.0.1:50052'}
            - {name: KVSTORE_MAX_INFLIGHT_RPCS, value: '1024'}
            - {name: KVSTORE_MAX_STREAMS, value: '256'}
            - {name: KVSTORE_TLS_CERT_FILE, value: /etc/kvstore/tls/server.crt}
            - {name: KVSTORE_TLS_KEY_FILE, value: /etc/kvstore/tls/server.key}
            - {name: KVSTORE_TLS_CLIENT_CA_FILE, value: /etc/kvstore/tls/client-ca.crt}
            - name: KVSTORE_ACCESS_POLICY_FILE
              valueFrom:
                secretKeyRef: {name: kvstore-access-policy, key: path, optional: true}
          volumeMounts:
            - {name: tls, mountPath: /etc/kvstore/tls, readOnly: true}
            - {name: access-policy, mountPath: /etc/kvstore/access, readOnly: true}
          startupProbe:
            exec:
              command: [/usr/local/bin/kvstore, healthcheck, liveness]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            exec:
              command: [/usr/local/bin/kvstore, healthcheck, readiness]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [/usr/local/bin/kvstore, healthcheck, liveness]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: tls
          secret:
            secretName: kvstore-server-tls
            defaultMode: 0440
        - name: access-policy
          secret:
            secretName: kvstore-access-policy
            optional: true
            defaultMode: 0440
            items:
              - key: policy.json
                path: policy.json
