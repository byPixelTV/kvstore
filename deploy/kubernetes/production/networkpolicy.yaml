apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kvstore-router
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: kvstore-router}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 50051}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: kvstore-metrics-scraper}
      ports:
        - {protocol: TCP, port: 7002}
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: kvstore-voter}
      ports:
        - {protocol: TCP, port: 50051}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kvstore-voter-from-router
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: kvstore-voter}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: kvstore-router}
      ports:
        - {protocol: TCP, port: 50051}
