apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kvstore-dns
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [kvstore-voter, kvstore-router]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kvstore-voter-scrape
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: kvstore-voter}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: kvstore-metrics-scraper}
      ports:
        - {protocol: TCP, port: 7001}
