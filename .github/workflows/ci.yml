name: CI

on:
  pull_request:
    branches: [stable, nightly]
  push:
    branches: [stable, nightly]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and checks
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Validate release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain only MAJOR.MINOR.PATCH (e.g. 0.1.0)"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            version="${version}-PR.${PR_NUMBER}"
          elif [[ "$REF_NAME" == "nightly" ]]; then
            version="${version}-SNAPSHOT"
          fi
          echo "build_version=$version" >> "$GITHUB_OUTPUT"

      - name: Check go.mod / go.sum
        run: go mod tidy -diff

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -name '*.go' -not -path './vendor/*' -print0)
          if (( ${#files[@]} )); then
            unformatted="$(gofmt -l "${files[@]}")"
            if [[ -n "$unformatted" ]]; then
              echo "Unformatted Go files:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

  test-sdks:
    name: Test and package SDKs
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Test clients against KVStore and verify packages
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.test.outputs.build_version }}
        run: |
          set -euo pipefail
          version="$BUILD_VERSION"
          if [[ "$version" == *-SNAPSHOT ]]; then
            version="$version.$GITHUB_RUN_NUMBER"
          fi
          bash scripts/test-sdks.sh "$version" "$RUNNER_TEMP/kvstore-npm"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-npm
          path: ${{ runner.temp }}/kvstore-npm/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Build and archive
        shell: bash
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          BUILD_VERSION: ${{ needs.test.outputs.build_version }}
        run: |
          set -euo pipefail
          mkdir -p staging dist
          export GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0
          suffix=""
          if [[ "$TARGET_OS" == "windows" ]]; then suffix=".exe"; fi

          go build -trimpath -ldflags="-s -w -X main.version=$BUILD_VERSION" \
            -o "staging/kvstore${suffix}" ./cmd/kvstore
          cp LICENSE staging/

          archive="kvstore-${BUILD_VERSION}-${TARGET_OS}-${TARGET_ARCH}"
          if [[ "$TARGET_OS" == "windows" ]]; then
            (cd staging && zip -q -9 "../dist/${archive}.zip" kvstore.exe LICENSE)
          else
            tar -C staging -czf "dist/${archive}.tar.gz" kvstore LICENSE
          fi

      - name: Scan the Linux release binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -mode binary staging/kvstore

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: kvstore-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-kvctl:
    name: Build and smoke-test kvctl for ${{ matrix.goos }}
    needs: test
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_VERSION: ${{ needs.test.outputs.build_version }}
      TARGET_OS: ${{ matrix.goos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            runner: ubuntu-latest
            native_arch: amd64
          - goos: darwin
            runner: macos-15
            native_arch: arm64
          - goos: windows
            runner: windows-latest
            native_arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and archive amd64 and arm64
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:GOOS = $env:TARGET_OS
          $isWindowsTarget = $env:TARGET_OS -eq 'windows'
          $binary = $isWindowsTarget ? 'kvctl.exe' : 'kvctl'
          New-Item -ItemType Directory -Path dist | Out-Null

          foreach ($arch in 'amd64', 'arm64') {
            $env:GOARCH = $arch
            $stage = "staging/$arch"
            $archive = "dist/kvctl-$env:BUILD_VERSION-$env:TARGET_OS-$arch"
            New-Item -ItemType Directory -Path $stage | Out-Null
            go build -trimpath "-ldflags=-s -w -X main.version=$env:BUILD_VERSION" -o "$stage/$binary" ./cmd/kvctl
            Copy-Item -LiteralPath LICENSE -Destination $stage

            if ($isWindowsTarget) {
              Compress-Archive -LiteralPath @("$stage/$binary", "$stage/LICENSE") -DestinationPath "$archive.zip"
            } else {
              tar -C $stage -czf "$archive.tar.gz" $binary LICENSE
            }
          }

      - name: Smoke-test the native archive
        shell: pwsh
        timeout-minutes: 1
        env:
          NATIVE_ARCH: ${{ matrix.native_arch }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = "dist/kvctl-$env:BUILD_VERSION-$env:TARGET_OS-$env:NATIVE_ARCH"
          New-Item -ItemType Directory -Path smoke | Out-Null
          if ($env:TARGET_OS -eq 'windows') {
            Expand-Archive -LiteralPath "$archive.zip" -DestinationPath smoke
            $binary = './smoke/kvctl.exe'
          } else {
            tar -C smoke -xzf "$archive.tar.gz"
            $binary = './smoke/kvctl'
          }
          $actual = @(& $binary --version) -join "`n"
          if ($actual -cne "kvctl $env:BUILD_VERSION") {
            throw "Unexpected kvctl version: $actual"
          }
          if ((Get-FileHash -LiteralPath smoke/LICENSE).Hash -ne (Get-FileHash -LiteralPath LICENSE).Hash) {
            throw "The archived license does not match LICENSE"
          }

      - name: Test the native Windows server mode
        if: matrix.goos == 'windows'
        run: go test ./cmd/kvstore

      - name: Smoke-test the Windows PowerShell demo
        if: matrix.goos == 'windows'
        shell: powershell
        timeout-minutes: 5
        run: |
          $OutputEncoding = [Text.Encoding]::Unicode
          .\scripts\start-kvctl-demo.ps1 -CheckOnly

      - name: Upload amd64 CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: kvctl-${{ matrix.goos }}-amd64
          path: dist/*-amd64.*
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64 CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: kvctl-${{ matrix.goos }}-arm64
          path: dist/*-arm64.*
          if-no-files-found: error
          retention-days: 14
