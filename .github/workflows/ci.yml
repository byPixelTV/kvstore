name: CI

on:
  pull_request:
    branches: [stable, nightly]
  push:
    branches: [stable, nightly]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain only MAJOR.MINOR.PATCH (e.g. 0.1.0)"
            exit 1
          fi

      - name: Check go.mod / go.sum
        run: go mod tidy -diff

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -name '*.go' -not -path './vendor/*' -print0)
          if (( ${#files[@]} )); then
            unformatted="$(gofmt -l "${files[@]}")"
            if [[ -n "$unformatted" ]]; then
              echo "Unformatted Go files:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Build and archive
        shell: bash
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            version="${version}-PR.${PR_NUMBER}"
          elif [[ "$REF_NAME" == "nightly" ]]; then
            version="${version}-SNAPSHOT"
          fi

          mkdir -p staging dist
          export GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0
          suffix=""
          if [[ "$TARGET_OS" == "windows" ]]; then suffix=".exe"; fi

          go build -trimpath -ldflags="-s -w -X main.version=$version" \
            -o "staging/kvstore${suffix}" ./cmd/kvstore

          archive="kvstore-${version}-${TARGET_OS}-${TARGET_ARCH}"
          if [[ "$TARGET_OS" == "windows" ]]; then
            (cd staging && zip -q -9 "../dist/${archive}.zip" "kvstore.exe")
          else
            tar -C staging -czf "dist/${archive}.tar.gz" kvstore
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: kvstore-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
