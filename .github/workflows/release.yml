name: Release

# Only publish after the exact CI push-run has passed.
# Unlike pull_request_target, this does not execute untrusted PR code with write permissions.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [stable, nightly]

permissions:
  contents: read

concurrency:
  group: kvstore-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.head_branch == 'stable' ||
           github.event.workflow_run.head_branch == 'nightly') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
      id-token: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid VERSION file"
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$BRANCH" == "stable" ]]; then
            build_version="$version"
            release_tag="v${version}"
            npm_version="$version"
            npm_channel=latest
            tags="${image}:${version}"
            tags+=$'\n'"${image}:latest"
          else
            build_version="${version}-SNAPSHOT"
            release_tag="v${version}-SNAPSHOT.${CI_RUN_NUMBER}.${CI_RUN_ATTEMPT}"
            npm_version="${version}-SNAPSHOT.${CI_RUN_NUMBER}"
            npm_channel=snapshot
            tags="${image}:${version}-SNAPSHOT.${CI_RUN_NUMBER}.${CI_RUN_ATTEMPT}"
            tags+=$'\n'"${image}:${version}-SNAPSHOT"
            tags+=$'\n'"${image}:nightly"
          fi

          {
            echo "branch=$BRANCH"
            echo "build_version=$build_version"
            echo "tag=$release_tag"
            echo "npm_version=$npm_version"
            echo "npm_channel=$npm_channel"
            echo "sha=$CI_SHA"
            echo 'docker_tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Skip previously published stable version
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.meta.outputs.branch }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "stable" ]] && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Stable tag ${TAG} already exists: skip publishing"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download binaries from successful CI run
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
        run: |
          set -euo pipefail
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'kvstore-*' --pattern 'kvctl-*' --dir ./dist

          archives=(
            kvstore-linux-amd64 kvstore-linux-arm64 kvstore-darwin-arm64 kvstore-windows-amd64
            kvctl-linux-amd64 kvctl-linux-arm64 kvctl-darwin-amd64 kvctl-darwin-arm64
            kvctl-windows-amd64 kvctl-windows-arm64
          )
          for artifact in "${archives[@]}"; do
            family="${artifact%%-*}"
            platform="${artifact#*-}"
            extension=tar.gz
            if [[ "$platform" == windows-* ]]; then extension=zip; fi
            archive="./dist/$artifact/$family-$BUILD_VERSION-$platform.$extension"
            if [[ ! -s "$archive" ]]; then
              echo "Missing or empty archive: $archive" >&2
              exit 1
            fi
          done
          test "$(find ./dist -type f | wc -l)" -eq "${#archives[@]}"

      - name: Download the tested npm package
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name sdk-npm --dir "$RUNNER_TEMP/kvstore-npm"

      - uses: actions/setup-java@v5
        if: steps.gate.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Publish Kotlin SDK
        if: steps.gate.outputs.publish == 'true'
        working-directory: sdk/kotlin
        shell: bash
        env:
          MAVEN_VERSION: ${{ steps.meta.outputs.build_version }}
          CHANNEL: ${{ steps.meta.outputs.branch }}
          ORG_GRADLE_PROJECT_bypixelUsername: ${{ secrets.BYPIXEL_REPO_USER }}
          ORG_GRADLE_PROJECT_bypixelPassword: ${{ secrets.BYPIXEL_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "stable" ]]; then
            # A previous attempt may have published Maven before a later step failed.
            bash ./gradlew --no-daemon "-PsdkVersion=$MAVEN_VERSION" publishMavenPublicationToVerificationRepository
            artifact="kvstore-$MAVEN_VERSION"
            base="dev/bypixel/kvstore/$MAVEN_VERSION"
            complete=true
            for file in "$artifact.jar" "$artifact-sources.jar" "$artifact.pom" "$artifact.module"; do
              if ! curl -fs --max-time 20 "https://repo.bypixel.dev/releases/$base/$file" \
                | cmp -s "build/verification-repo/$base/$file" -; then
                complete=false
                break
              fi
            done
            if [[ "$complete" == true ]]; then
              echo "Maven version $MAVEN_VERSION already matches this build"
              exit 0
            fi
          fi
          bash ./gradlew --no-daemon "-PsdkVersion=$MAVEN_VERSION" publishMavenPublicationToBypixelRepository

      - name: Publish TypeScript SDK
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_VERSION: ${{ steps.meta.outputs.npm_version }}
          NPM_CHANNEL: ${{ steps.meta.outputs.npm_channel }}
        run: |
          set -euo pipefail
          package="@bypixeltv/kvstore"
          archive="$RUNNER_TEMP/kvstore-npm/bypixeltv-kvstore-$NPM_VERSION.tgz"
          test -s "$archive"
          if npm publish "$archive" --access public --tag "$NPM_CHANNEL"; then
            exit 0
          fi
          # npm versions are immutable. Retry only succeeds if an earlier attempt published these bytes.
          expected="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          actual="$(npm view "$package@$NPM_VERSION" dist.integrity)"
          test "$expected" = "$actual"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Docker image (amd64 + arm64)
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_CHANNEL=${{ steps.meta.outputs.branch }}
          tags: ${{ steps.meta.outputs.docker_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.build_version }}

      - name: Create GitHub release and Go module tag
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.meta.outputs.branch }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          args=(--target "$SHA" --title "$TAG" --generate-notes)
          if [[ "$CHANNEL" == "nightly" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" ./dist/*/* "${args[@]}"
