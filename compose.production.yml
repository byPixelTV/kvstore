# Apply together with compose.sharded.yml.
services:
  router:
    ports: !override
      - '127.0.0.1:17110:7002'
    stop_grace_period: 30s
  ingress:
    image: ${KVSTORE_ENVOY_IMAGE:-envoyproxy/envoy:v1.40.2}
    command: ["-c", "/etc/envoy/production.yaml", "--log-level", "warning"]
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - ./deploy/envoy/production.yaml:/etc/envoy/production.yaml:ro
      - ${KVSTORE_TLS_DIR:?Set KVSTORE_TLS_DIR}:/etc/kvstore/tls:ro
    ports:
      - '${KVSTORE_INGRESS_IP:-127.0.0.1}:${KVSTORE_INGRESS_PORT:-5443}:5443'
