syntax = "proto3";

package kvstore.v1;

option go_package = "github.com/byPixelTV/kvstore/gen/go/kvstore/v1;kvstorev1";

service KVStore {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Single shard: atomic; multi-shard: independent shard batches, per-item outcomes.
  // Clients MUST NOT blindly retry UNKNOWN_OUTCOME on a network failure.
  rpc BatchWrite(BatchWriteRequest) returns (BatchWriteResponse);
  rpc Head(HeadRequest) returns (HeadResponse);
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  rpc Scan(ScanRequest) returns (stream ScanResponse);
  // Internal Raft-replicated write fence for lossless live slot migration.
  // Only trusted router may call this, authenticated by the join token.
  rpc FenceSlot(FenceSlotRequest) returns (FenceSlotResponse);
}

// STRONG is the default for backwards compatibility. EVENTUAL reads from
// the selected node's committed local FSM and may be behind the leader.
enum ReadConsistency {
  READ_CONSISTENCY_STRONG = 0;
  READ_CONSISTENCY_EVENTUAL = 1;
}

message GetRequest {
  string namespace = 1;
  string key = 2;
  ReadConsistency consistency = 3;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  uint64 revision = 3;
}

message SetRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
}

message SetResponse {
  uint64 revision = 1;
}

message DeleteRequest {
  string namespace = 1;
  string key = 2;
}

message DeleteResponse {
  bool deleted = 1;
  uint64 revision = 2;
}

// Maximum 128 operations and 192 KiB of raw values per request. Within each
// shard operations are ordered and atomic; across shards they are NOT atomic.
message BatchWriteOperation {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  bool delete = 4;
}
message BatchWriteRequest { repeated BatchWriteOperation operations = 1; }
message BatchWriteResult {
  uint64 revision = 1;
  bool deleted = 2;
  // 0 on success; otherwise a canonical gRPC status code for THIS item.
  // On a transport timeout, the outcome may be unknown: never blindly retry.
  uint32 grpc_code = 3;
  string error = 4;
}
message BatchWriteResponse { repeated BatchWriteResult results = 1; }


// On standalone and single-Raft: Head gives the authoritative revision.
// Multi-Raft requires use_vector_cursor and returns cursor (revision=0).
message HeadRequest { bool use_vector_cursor = 1; }
message HeadResponse {
  uint64 revision = 1;
  uint64 oldest_available_revision = 2;
  // Opaque cursor for multi-Raft. Set use_vector_cursor on requests.
  string cursor = 3;
}

// A namespace is mandatory. An empty key watches all keys in that namespace.
// After_revision is an exclusive cursor; checkpoints advance the cursor when
// other keys changed. OUT_OF_RANGE means a full cache resync is required.
message WatchRequest {
  string namespace = 1;
  string key = 2;
  uint64 after_revision = 3;
  // Multi-Raft requires a per-shard cursor vector; legacy uint64 cursors are invalid.
  string cursor = 4;
  bool use_vector_cursor = 5;
}
message WatchResponse {
  uint64 revision = 1;
  string namespace = 2;
  string key = 3;
  bytes value = 4;
  bool deleted = 5;
  bool checkpoint = 6;
  string cursor = 7;
  uint32 shard = 8;
}

// Single-Raft: the first message is a consistent snapshot checkpoint; then
// Watch(after_revision=snapshot_revision). Multi-Raft: request vector mode,
// consume all records, then the FINAL checkpoint with the opaque cursor.
// Resync by Watch(cursor=final_checkpoint.cursor) in vector mode.
message ScanRequest {
  string namespace = 1;
  bool use_vector_cursor = 2;
}
message ScanResponse {
  uint64 snapshot_revision = 1;
  string key = 2;
  bytes value = 3;
  uint64 revision = 4;
  bool checkpoint = 5;
  // Final checkpoint after ALL shard snapshots have completed.
  string cursor = 6;
  uint32 shard = 7;
}

// A fence is replicated within the source/target Raft group and applied in
// Raft log order. A sealed slot rejects later SET/DELETE, even after restart.
message FenceSlotRequest {
  string namespace = 1;
  uint32 slot = 2;
  bool sealed = 3;
}
message FenceSlotResponse {}
